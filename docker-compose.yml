services:
  grupo9_bdd:
    image: postgres:16-alpine
    container_name: grupo9_bdd
    restart: always
    networks:
      - red_taller_software
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: encuestas_db
    volumes:
      - grupo9_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d encuestas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  grupo9_backend:
    container_name: grupo9_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - red_taller_software
    environment:
      - DATABASE_URL=postgresql://admin:password123@grupo9_bdd:5432/encuestas_db?schema=public
      - PORT=4009
      - ORIGIN=http://grupo9.146.83.216.166.nip.io
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4009/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      grupo9_bdd:
        condition: service_healthy

  grupo9_frontend:
    container_name: grupo9_frontend
    build:
      context: .
      dockerfile: docker/app/Dockerfile.dev
    networks:
      - red_taller_software
    environment:
      - DATABASE_URL=postgresql://admin:password123@grupo9_bdd:5432/encuestas_db?schema=public
      - NEXTAUTH_URL=http://grupo9.146.83.216.166.nip.io
      - NEXTAUTH_SECRET=un-secreto-seguro-para-taller-ingeso-grupo9
      - BACKEND_URL=http://grupo9_backend:4009
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_BACKEND_URL=http://grupo9.146.83.216.166.nip.io/api
      - PORT=3009
    depends_on:
      grupo9_bdd:
        condition: service_healthy
      grupo9_backend:
        condition: service_healthy

networks:
  red_taller_software:
    external: true

volumes:
  grupo9_postgres_data:
